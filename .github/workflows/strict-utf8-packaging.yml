name: Package qualified single-decode UTF8 DLLs only
on:
  push:
    branches: [qualification/optimized-utf8-packaging]
permissions:
  contents: read
  actions: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a1d5907c4db520279d335651b74d093b17deac2f
          path: qualified-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Package exact qualified binaries without compilation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/pack-qualified-utf8.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-utf8-packages
          path: utf8-packages
          retention-days: 7
